project:
  name: "Enveda-CASMI-2026-Molecules"
  description: "Deep Spectral Representation & Candidate Retrieval Platform for 2D Chemical Structure Prediction from Tandem Mass Spectra"
  version: "1.0.0"
  competition: "enveda-CASMI26-molecule-id-mass-spectra"
  kaggle_url: "https://www.kaggle.com/competitions/enveda-CASMI26-molecule-id-mass-spectra"
  license: "MIT"
  created_at: "2026-10-27"

mentorship:
  instructor: "Dr. Asif Assad"
  designation: "Assistant Professor & Research Mentor"
  institution: "Islamic University of Science and Technology (IUST), Kashmir"
  authors:
    - name: "Dar Rehan Rasool"
      role: "Project Lead & ML Architect"
      email: "darrehanrasool@gmail.com"
    - name: "Muneeb Syed Shah"
      role: "Contributing Researcher"
    - name: "Shafiya Bashir Pampori"
      role: "Contributing Researcher"

environment:
  seed: 42
  deterministic: true
  precision: "float32"

paths:
  data_dir: "data"
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  external_dir: "data/external"
  manifest_dir: "data/manifests"
  checkpoints_dir: "checkpoints"
  models_dir: "outputs/trained_models"
  outputs_dir: "outputs"
  predictions_dir: "outputs/predictions"
  logs_dir: "logs"
  reports_dir: "reports"
  visualizations_dir: "visualizations"
  papers_dir: "papers"
  experiments_dir: "experiments"

evaluation:
  metric: "MRR@25"
  max_candidates: 25
  matching: "InChIKey14"
  rdkit_tautomer_canonicalization: true
  rdkit_version: "2026.03.3"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - [%(filename)s:%(lineno)d] - %(message)s"
  handlers:
    - "console"
    - "file"
  file_path: "logs/application/molecules.log"
