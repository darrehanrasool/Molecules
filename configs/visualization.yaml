style:
  theme: "seaborn-v0_8-whitegrid"
  dpi: 300
  font_family: "sans-serif"
  palette: "deep"
  figure_sizes:
    spectrum_plot: [12, 6]
    metric_curve: [8, 6]
    correlation_heatmap: [10, 8]
    model_comparison: [10, 6]

colors:
  primary: "#1f77b4"
  secondary: "#ff7f0e"
  success: "#2ca02c"
  warning: "#d62728"
  neutral: "#7f7f7f"
