models:
  baseline_retrieval:
    type: "precursor_filtered_spectral_search"
    precursor_ppm_tolerance: 15.0
    similarity_metric: "modified_cosine"
    candidate_db: "data/external/pubchem_compounds.parquet"
    top_k: 25

  spectral_encoder:
    type: "1d_cnn_mlp"
    input_dim: 14900 # (1500 - 10) / 0.1
    hidden_dims: [1024, 512, 256]
    embedding_dim: 256
    dropout: 0.2
    activation: "relu"
    use_batch_norm: true

  fingerprint_predictor:
    type: "neural_fingerprint"
    spectral_backbone: "spectral_encoder"
    target_fingerprint: "morgan_chiral_2048"
    loss: "bce_with_logits"
    learning_rate: 0.0003

  reranker:
    type: "hybrid_consensus"
    weights:
      spectral_similarity: 0.4
      precursor_mass_delta: 0.3
      fingerprint_tanimoto: 0.3
    max_output_candidates: 25
