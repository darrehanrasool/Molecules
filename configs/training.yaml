training:
  seed: 42
  batch_size: 64
  epochs: 50
  early_stopping_patience: 10
  gradient_accumulation_steps: 1
  mixed_precision: true

optimizer:
  type: "AdamW"
  lr: 0.0003
  weight_decay: 0.01
  betas: [0.9, 0.999]

scheduler:
  type: "CosineAnnealingLR"
  T_max: 50
  eta_min: 0.000001
  warmup_epochs: 3

checkpoints:
  save_best_only: true
  monitor: "val_mrr_25"
  mode: "max"
  dir: "checkpoints/best"

logging:
  log_interval_steps: 50
  evaluate_interval_epochs: 1
