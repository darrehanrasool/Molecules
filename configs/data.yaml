raw_files:
  train_spectra: "data/raw/train.parquet"
  test_spectra: "data/raw/test.parquet"
  sample_submission: "data/raw/sample_submission.csv"

preprocessing:
  min_intensity_rel: 0.005 # Filter peaks below 0.5% base peak intensity
  max_peaks_per_spectrum: 300 # Top 300 peaks per spectrum
  normalize_intensity: true
  normalization_method: "base_peak" # base_peak or tic (total ion current)
  mz_tolerance_ppm: 10.0 # High resolution instrument tolerance (10 ppm)
  bin_size: 0.1 # m/z binning width for dense representation
  min_mz: 10.0
  max_mz: 1500.0
  compute_neutral_losses: true

adducts:
  positive:
    - "[M+H]+"
    - "[M+NH4]+"
    - "[M+Na]+"
    - "[M+K]+"
  negative:
    - "[M-H]-"
    - "[M+FA-H]-"
    - "[M+Cl]-"

splits:
  method: "scaffold_or_inchikey" # split by InChIKey skeleton to prevent data leakage
  n_splits: 5
  seed: 42
  validation_ratio: 0.15
  test_ratio: 0.15

external_databases:
  massbank: "data/external/massbank_msms.parquet"
  gnps: "data/external/gnps_library.parquet"
  mona: "data/external/mona_export.parquet"
  hmdb: "data/external/hmdb_metabolites.parquet"
  pubchem_natural_products: "data/external/pubchem_compounds.parquet"
