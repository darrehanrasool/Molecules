[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "casmi2026-molecule-id"
version = "0.1.0"
description = "Molecule identification from mass spectra for CASMI 2026"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "pyarrow",
    "scipy"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
